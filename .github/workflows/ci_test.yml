name: CI Tests

on:
  pull_request:
    branches:
      - main
    types: [ opened, synchronize, reopened ]

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      should_run: ${{ steps.filter.outputs.src }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            src:
              - 'packages/prisma-ts-select/**'

  test-runner:
    needs: changes
    if: needs.changes.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Build
        run: pnpm --filter prisma-ts-select build

      - name: Test with coverage
        run: pnpm --filter prisma-ts-select test:coverage:ci

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: lcov-coverage
          path: packages/prisma-ts-select/lcov.info

  test-status:
    needs: [changes, test-runner]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - if: needs.test-runner.result == 'failure' || needs.test-runner.result == 'cancelled'
        run: exit 1
