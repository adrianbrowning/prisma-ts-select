name: v6-sqlite
on:
  push:
    branches: [main]
  pull_request:
    branches: ["*"]

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      should_run: ${{ steps.filter.outputs.src }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            src:
              - 'packages/prisma-ts-select/**'
              - 'packages/usage-sqlite-v6/**'
              - 'shared-tests/**'

  test:
    needs: changes
    if: needs.changes.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node }}

      - name: Build prisma-ts-select
        run: pnpm --filter prisma-ts-select build

      - name: Generate Prisma client
        run: pnpm --filter usage-sqlite-v6 gen

      - name: Reset database
        run: pnpm --filter usage-sqlite-v6 p:r

      - name: TypeScript check
        run: pnpm --filter usage-sqlite-v6 lint:ts

      - name: Run tests
        run: pnpm --filter usage-sqlite-v6 test
