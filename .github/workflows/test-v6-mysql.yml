name: v6-mysql
on:
  push:
    branches: [main]
  pull_request:
    branches: ["*"]

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      should_run: ${{ steps.filter.outputs.src }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            src:
              - 'packages/prisma-ts-select/**'
              - 'packages/usage-mysql-v6/**'
              - 'shared-tests/**'

  test:
    needs: changes
    if: needs.changes.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node: [22.x, 24.x, 26.x]

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: prisma_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -ptest"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node }}

      - name: Build prisma-ts-select
        run: pnpm --filter prisma-ts-select build

      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            if mysqladmin ping -h 127.0.0.1 -P 3306 -uroot -ptest --silent; then
              echo "MySQL ready"
              exit 0
            fi
            echo "Waiting for MySQL... ($i/30)"
            sleep 2
          done
          exit 1

      - name: Generate Prisma client
        run: pnpm --filter usage-mysql-v6 gen

      - name: Reset database
        run: pnpm --filter usage-mysql-v6 p:r

      - name: TypeScript check
        run: pnpm --filter usage-mysql-v6 lint:ts

      - name: Run tests
        if: matrix.node != '26.x'
        run: pnpm --filter usage-mysql-v6 test

      - name: Run tests with coverage
        if: matrix.node == '26.x'
        run: pnpm --filter usage-mysql-v6 test:coverage:ci

  test-status:
    needs: [changes, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - if: needs.test.result == 'failure' || needs.test.result == 'cancelled'
        run: exit 1
