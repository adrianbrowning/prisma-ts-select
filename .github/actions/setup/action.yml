name: Setup
description: Checkout, install pnpm + Node.js, cache pnpm store, install dependencies, build generator, run gen

inputs:
  node-version:
    description: Node.js version
    default: '26'
  checkout-ref:
    description: Git ref to checkout (e.g. github.head_ref for PRs)
    default: ''
  checkout-fetch-depth:
    description: Fetch depth for checkout
    default: '1'

runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-base
      with:
        node-version: ${{ inputs.node-version }}
        checkout-ref: ${{ inputs.checkout-ref }}
        checkout-fetch-depth: ${{ inputs.checkout-fetch-depth }}

    - name: Build generator and relink bins
      shell: bash
      run: |
        pnpm --filter prisma-ts-select build
        pnpm install --frozen-lockfile

    - name: Run Gen
      shell: bash
      run: pnpm -r gen
